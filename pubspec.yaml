name: inventory
description: "AL ASHAB — offline-first shop inventory, sales and accounting."
publish_to: 'none'

# M0 note: version bumped to 2.0.0 to mark the start of the v2 rewrite
# described in notes/business_logic.md and ARCHITECTURE.md. Build number
# reset since this is a clean local-schema reset, not an upgrade path.
version: 2.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # --- State management, routing, i18n (kept from v1; the 378-key
  # en/bn translation investment and GetX familiarity are both real and
  # worth keeping — see ARCHITECTURE.md "Why GetX stays") ---
  get: ^4.7.3

  # --- Local persistence ---
  drift: ^2.26.0
  drift_flutter: ^0.3.1
  # Bundles the native sqlite3 library for Android/Windows/macOS/Linux so
  # Drift has a consistent engine across every non-web target.
  sqlite3_flutter_libs: ^0.6.0
  path: ^1.9.1
  path_provider: ^2.1.6

  # --- Identity, correctness ---
  # UUIDv7 client-generated primary keys (RFC 9562) so offline inserts on
  # different devices never collide and stay roughly time-sortable — see
  # ARCHITECTURE.md / SYNC.md.
  uuid: ^4.5.1

  # --- Supabase backend + connectivity awareness for the sync engine ---
  supabase_flutter: ^2.16.0
  connectivity_plus: ^6.1.5
  flutter_secure_storage: ^10.3.1

  # --- Networking & Cloud Uploads ---
  http: ^1.3.0
  crypto: ^3.0.6

  # --- Logging ---
  # Lightweight, coloured debug logging. AppLogger (see lib/core/utils/)
  # wraps this so the rest of the app only touches our own API.
  logger: ^2.5.0

  # --- Images ---
  # Native-encoder compression (fast enough for camera-resolution photos,
  # unlike the pure-Dart `image` package) for the two-tier thumbnail/full
  # pipeline. Mobile/desktop only for now — see the Web caveat in
  # ARCHITECTURE.md's platform capability matrix.
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  # Cross-platform file picker used as the Windows/Web fallback wherever
  # camera capture isn't available (see lib/core/platform/capabilities.dart).
  file_selector: ^1.0.3

  # --- Existing feature dependencies kept through the transition ---
  intl: ^0.20.3
  speech_to_text: ^7.4.0
  google_fonts: ^8.2.0
  iconsax: ^0.0.8
  share_plus: ^13.3.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.2.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Required in addition to flutter_test: CI's "Dart core" job runs plain
  # `dart test test/core/ test/domain/` (not `flutter test`) so the
  # pure-Dart domain/core suite can run without a Flutter build — that
  # command needs package:test resolvable directly, which flutter_test
  # alone does not provide.
  test: ^1.25.9
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.5.4
  # Test doubles for repository/use-case tests in M1 onward — avoids hand
  # writing a fake implementation of every repository interface.
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/shop_logo.jpeg

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/shop_logo.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/shop_logo.jpeg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/shop_logo.jpeg"
    icon_size: 48
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/shop_logo.jpeg"

