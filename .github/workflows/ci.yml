name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs on the same ref so a fast-follow push doesn't
# queue behind an already-running job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Pure-Dart core: format + layer-boundary check + dart test
  #    Uses the Flutter SDK to resolve pubspec.yaml (which declares
  #    `flutter: sdk: flutter`), but only exercises pure-Dart code:
  #    dart format, tool/check_layer_boundaries.sh, and dart test on
  #    test/core/ + test/domain/ — no widgets, no emulators.
  #    M1 extends this to also cover test/domain/ (pure-Dart profit-
  #    calculator and purchase-reconciliation tests).
  # ─────────────────────────────────────────────────────────────────────
  dart-core:
    name: "Dart core (format · boundaries · tests)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Flutter SDK is required to resolve pubspec.yaml — the pubspec
          # declares `flutter: sdk: flutter`, so a plain `dart pub get` (with
          # dart-lang/setup-dart) can never succeed. dart format and dart test
          # still work fine once Flutter's bundled Dart SDK is on the PATH.
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed lib/ test/

      - name: Layer boundary check
        run: bash tool/check_layer_boundaries.sh

      - name: dart test (pure-Dart core + domain)
        # M1: test/domain/ contains pure-Dart tests for calculateGrossProfitPerSale,
        # calculateShopNetProfit, calculateInvestorProfitShare, and
        # reconcilePurchaseTrip — none of which import Flutter or Drift, so
        # they run here against the Dart SDK rather than in the flutter job.
        run: dart test test/core/ test/domain/ --reporter=expanded

  # ─────────────────────────────────────────────────────────────────────
  # 2. Full Flutter: analyze + test + debug build for every target
  #    Uses the stable channel matching the Dart SDK constraint above.
  # ─────────────────────────────────────────────────────────────────────
  flutter:
    name: "Flutter (${{ matrix.target }})"
    needs: dart-core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # stable channel; Flutter 3.32+ ships Dart ≥3.11 which satisfies
          # the `sdk: ^3.11.0` lower bound in pubspec.yaml.
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # M1 adds a Drift schema (lib/data/local/app_database.dart) which uses
      # `part 'database.g.dart'`. The generated file is gitignored, so CI must
      # run build_runner before any step that compiles or tests Flutter code.
      # This runs on every matrix leg so each target's build has the file.
      - name: Drift codegen (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # analyze only once (on the android/ubuntu runner) — it's
      # platform-independent so running it three times is just noise.
      - name: flutter analyze
        if: matrix.target == 'android'
        run: flutter analyze --no-fatal-infos
        # NOTE: --fatal-infos is intentionally omitted here.
        # The v1 feature screens still emit info-level hints; those will be
        # resolved module-by-module through M1–M3. Tracked as M4 hardening.

      - name: flutter test
        if: matrix.target == 'android'
        run: flutter test --reporter=expanded

      # ── Android ─────────────────────────────────────────────────────
      - name: Setup Java (Android build)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: flutter build apk --debug (Android)
        if: matrix.target == 'android'
        run: flutter build apk --debug

      # ── Web ─────────────────────────────────────────────────────────
      - name: flutter build web --profile (Web)
        if: matrix.target == 'web'
        # --profile is cheaper than --release but still exercises the
        # dart2wasm / dart2js pipeline fully enough to catch import errors.
        run: flutter build web --profile

      # ── Windows ─────────────────────────────────────────────────────
      - name: flutter build windows --debug (Windows)
        if: matrix.target == 'windows'
        run: flutter build windows --debug
